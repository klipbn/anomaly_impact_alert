[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly_impact_alert"
version = "0.4.11"
description = "Anomaly detection, impact explanation, forecasting, and alerting toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{name = "Alexey Voronko"}]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "bottleneck>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "prophet>=1.1",
    "statsmodels>=0.13",
    "requests>=2.0",
    "holidays>=0.20",
]
